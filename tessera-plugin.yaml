# Needle gauge: a sensor's value as a dial with a needle, the name on top and the number under it.
# Every field is explained in docs/MANIFEST.md of github.com/MaxGramser/tessera-plugins.
id: needle_gauge
version: 0.2.0
api: "0.10"
icon: gauge
maintainer: Nekromonger
license: MIT
stage: beta
topics: [home, energy]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6

tiles:
  - id: gauge
    name: tile_name
    icon: gauge
    sizes: { min: 1x2, max: 4x4 }
    memory: 900
    domains: [sensor]
    attributes: [unit_of_measurement]
    # Only sensors that measure a number: a short list in the inspector instead of every sensor in the house.
    has_attributes: [state_class]
    example: tile_example
    preview: { title: "{name}", value: "{state}" }
    options:
      - { id: title, kind: text, label: title, hint: title_hint }
      - { id: min, kind: text, label: min, hint: min_hint, default: "0" }
      - { id: max, kind: text, label: max, hint: max_hint, default: "100" }
      - { id: decimals, kind: choice, label: decimals, default: auto,
          choices: [{ value: auto, label: decimals_auto }, { value: "0", label: decimals_0 },
                    { value: "1", label: decimals_1 }, { value: "2", label: decimals_2 }] }
      - { id: colors, kind: choice, label: colors, hint: colors_hint, default: accent,
          choices: [{ value: accent, label: colors_accent }, { value: high_bad, label: colors_high_bad },
                    { value: low_bad, label: colors_low_bad }] }
